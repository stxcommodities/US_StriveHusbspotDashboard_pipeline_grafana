# Template only -- do not fill in a real connection string and commit it.
# Same guidance as the HubSpot token secret: prefer your secrets-manager
# operator over a plaintext manifest.
#
#   kubectl create secret generic pipeline-etl-secrets \
#     --namespace=<your-namespace> \
#     --from-literal=HUBSPOT_PRIVATE_APP_TOKEN='<token>' \
#     --from-literal=DATABASE_URL='postgresql://user:pass@host:5432/dbname'
#
apiVersion: v1
kind: Secret
metadata:
  name: pipeline-etl-secrets
  namespace: CHANGE_ME
type: Opaque
stringData:
  HUBSPOT_PRIVATE_APP_TOKEN: "REPLACE_ME"
  DATABASE_URL: "REPLACE_ME"
